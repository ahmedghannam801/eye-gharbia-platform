# netlify.toml - Automatic configuration for Netlify deployment
# This file configures the build settings so that manual dashboard setup is minimized.

[build]
  # The command Netlify runs to build the project
  command = "npm run build"
  
  # The folder Netlify serves to the web (Vite builds into 'dist')
  publish = "dist"

[build.environment]
  # Vite 6 and React 19 require modern Node.js versions
  NODE_VERSION = "20"

# Redirect rule to route all requests to index.html for client-side routing fallback if needed
[[redirects]]
  from = "/*"
  status = 200
  to = "/index.html"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.brevo.com https://api.resend.com https://docs.google.com https://onesignal.com https://*.onesignal.com; frame-ancestors 'self';"


